# Configuration for cargo-deny, run by scripts/check.sh and .github/workflows/security.yml.
#
# Three questions, none of which the compiler answers: is a dependency subject
# to a published advisory, is its licence compatible with shipping this under
# MIT, and did it come from somewhere other than crates.io.

[advisories]
version = 2
# Nothing is ignored. An entry here is a decision to live with a known
# vulnerability, and it should carry the advisory identifier and the reason.
ignore = [
    # bincode is unmaintained, with no replacement syntect accepts yet. It only
    # decodes the grammars and themes compiled into the binary, never data from
    # outside, so a flaw in it cannot be reached by a file being opened. To
    # revisit when syntect moves off bincode 1.
    { id = "RUSTSEC-2025-0141", reason = "syntect decodes only its own embedded dumps with it" },
]

[licenses]
version = 2
# Derived from the dependency tree as it actually stands (cargo deny list -l license),
# not from a template. A new licence appearing here is a fact worth being told about.
# LGPL-2.1-or-later is absent on purpose: the one crate offering it (r-efi) is
# also offered under MIT, and that is the licence taken.
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "ISC",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "Unicode-3.0",
    "Unlicense",
    # foldhash, through ratatui's hash maps. Permissive and OSI approved.
    "Zlib",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
# A dependency pinned to "*" takes whatever version the registry happens to hold.
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
