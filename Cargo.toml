[workspace]
members = [
    "crates/core",
    "crates/llm",
    "crates/tools",
    "crates/codemap",
    "crates/agent",
    "crates/ui",
    "crates/gui",
    "crates/mcp",
    ".",
]
resolver = "3"

[workspace.package]
version     = "0.1.0"
edition     = "2024"
# The oldest toolchain the code is known to build on. CI holds it to this, so
# the promise is checked rather than asserted.
rust-version = "1.95"
authors     = ["Nicolas Godzik"]
license     = "MIT"

[workspace.dependencies]
universe-core = { path = "crates/core", version = "0.1.0" }
universe-llm  = { path = "crates/llm", version = "0.1.0" }
universe-tools = { path = "crates/tools", version = "0.1.0" }
universe-codemap = { path = "crates/codemap", version = "0.1.0" }
universe-agent = { path = "crates/agent", version = "0.1.0" }
universe-ui    = { path = "crates/ui", version = "0.1.0" }
universe-gui   = { path = "crates/gui", version = "0.1.0" }
universe-mcp   = { path = "crates/mcp", version = "0.1.0" }

thiserror  = "2.0.21"
anyhow     = "1.0.104"
serde      = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
yaml-rust2 = "0.13.0"
tokio      = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }
clap       = { version = "4.6.7", features = ["derive", "env"] }
# The default TLS backend verifies against the operating system trust store, so
# a corporate proxy whose root is installed on the machine just works, where a
# bundled root list would refuse it.
reqwest    = { version = "0.13.5", features = ["json"] }
tracing            = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
proptest   = "1.11.0"
tempfile   = "3.27.0"
regex      = "1.13.1"
similar    = "3.2.0"
toml       = "1.1.6"
# The directory walker of ripgrep: it skips what .gitignore skips.
ignore     = "0.4.33"
# Parsers for the code map.
tree-sitter            = "0.27.1"
tree-sitter-rust       = "0.24.2"
tree-sitter-python     = "0.25.0"
tree-sitter-typescript = "0.23.2"
tree-sitter-javascript = "0.25.0"
# Pure Rust regex engine instead of the default C Oniguruma: nothing to build
# in C, the same on every platform.
# The window: Bevy draws it on the GPU, egui the panels, egui_plot the
# charts. bevy_egui 0.42 is the release for Bevy 0.19 and egui 0.36, which
# egui_plot 0.37 is built on. Only what a desktop window needs is enabled:
# no audio, no gamepads, no glTF.
bevy       = { version = "0.19.1", default-features = false, features = [
    "std", "async_executor", "multi_threaded", "bevy_log", "bevy_winit", "bevy_window",
    "x11", "wayland", "bevy_render", "bevy_core_pipeline", "bevy_asset", "bevy_color", "hdr",
    "bevy_post_process", "bevy_camera", "bevy_mesh", "bevy_image", "bevy_shader", "bevy_material",
    "bevy_pbr", "bevy_light", "bevy_gizmos", "bevy_gizmos_render",
] }
bevy_egui  = { version = "0.42.0", default-features = false, features = ["render", "default_fonts"] }
egui_plot  = "0.37.0"
syntect    = { version = "5.3.0", default-features = false, features = ["default-syntaxes", "default-themes", "regex-fancy"] }
# Images a model is shown: read to know their size, halved when a provider
# refuses them as too large. The version Bevy already brings.
image      = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
base64     = "0.22.1"

[package]
name    = "universe"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "A terminal coding agent that lets deterministic tools do the work before any model does."

[[bin]]
name = "universe"
path = "src/main.rs"

[dependencies]
universe-core.workspace     = true
universe-llm.workspace      = true
universe-tools.workspace    = true
universe-agent.workspace    = true
universe-ui.workspace       = true
universe-gui.workspace      = true
universe-mcp.workspace      = true
anyhow.workspace             = true
clap.workspace               = true
serde.workspace              = true
serde_json.workspace         = true
tokio = { workspace = true, features = ["time"] }
tracing.workspace            = true
tracing-subscriber.workspace = true

[profile.release]
lto           = "fat"
codegen-units = 1
# Token counts and costs are summed over a whole session. An overflow that
# wraps silently would print a number that looks like a bill; a panic is the
# cheaper failure.
overflow-checks = true

# Dependencies are built optimised in a debug build too: syntect, egui and
# Bevy run tens of times slower without, enough to make the window lag on
# every key, while universe's own crates stay quick to rebuild.
[profile.dev.package."*"]
opt-level = 3

# The map of a large project is read on every Ctrl-N: optimised in debug
# builds too, it takes about a second for 15,000 files rather than many.
[profile.dev.package.universe-codemap]
opt-level = 3
