name: Security

# Dependencies do not have to change for the news about them to change, hence
# the schedule on top of push.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 6"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deny:
    name: Advisories, licences, sources
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
